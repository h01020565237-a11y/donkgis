<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동기의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{color-scheme:dark;--bg:#16201a;--ink:#f4efe0;--gold:#ffcf3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Malgun Gothic",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas#c{display:block;width:100%;height:100%;image-rendering:pixelated}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,16,12,.9);padding:16px;text-align:center;overflow:auto;touch-action:pan-y}
#ov.t{background:none;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));overflow:hidden}
#ov.t h1{text-shadow:0 3px 0 #5a1d3a,0 0 22px rgba(255,170,80,.6);line-height:1.15}
.bt{display:flex;flex-direction:column;gap:10px;align-items:center}
.b{font:inherit;font-size:20px;padding:10px 30px;background:var(--gold);color:#2a2000;border:0;cursor:pointer;box-shadow:0 4px 0 #a07d10;min-width:190px}
.b.s{background:#3b4f6b;color:#fff;box-shadow:0 4px 0 #1e2b3d}
.b:focus-visible,.it:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gd{color:var(--gold);font-size:18px}
.sl{font-size:16px;margin:6px 0 4px;opacity:.9}
.gi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.it{font:inherit;width:118px;padding:8px 4px;background:#243326;color:inherit;border:3px solid #3f5a43;cursor:pointer;font-size:13px;line-height:1.4}
.it.eq{border-color:var(--gold);background:#35482f}
.it.no{opacity:.55}
.it b{display:block;font-weight:400;font-size:15px}
.rs{font-size:17px;line-height:1.8}
h1{margin:0;font-size:clamp(26px,6vw,44px);font-weight:400;color:var(--gold)}
p{margin:0;font-size:15px;max-width:34em;line-height:1.55}
#lst{position:fixed;left:8px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;background:rgba(0,0,0,.45);padding:6px 8px;min-width:96px}
#lst:empty{display:none}
#lst div{display:flex;align-items:center;gap:6px;font-size:16px}
#lst canvas{width:20px;height:30px;image-rendering:pixelated}
#lst b{font-weight:400;margin-left:auto;color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lst"></div>
<div id="ov"></div>

  G();rr(-10,-166,20,18,5,SKN);ctx.fillStyle='#231c1a';ctx.beginPath();ctx.ellipse(0,-188,33,36,0,0,7);ctx.fill();ctx.shadowBlur=0;

  rr(-14,-157,28,8,4,'#2f60a8');

function drawTitle(){
  const hz=H*.5,cx=W/2,m=Math.min(W,H),gy=H*.79,tt=performance.now()/1000,s0=Math.min(.46*H/215,W/330);
  let g=ctx.createLinearGradient(0,0,0,hz);[[0,'#2b1850'],[.4,'#7a2a6a'],[.7,'#d6455a'],[.9,'#ff8a4a'],[1,'#ffd27a']].forEach(([o,c])=>g.addColorStop(o,c));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
  g=ctx.createRadialGradient(cx,hz,m*.02,cx,hz,m*.36);g.addColorStop(0,'#fff6c0');g.addColorStop(.35,'rgba(255,179,71,.8)');g.addColorStop(1,'rgba(255,120,60,0)');
  ctx.fillStyle=g;ctx.fillRect(0,hz-m*.36,W,m*.36);ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(cx,hz,m*.13,Math.PI,0);ctx.fill();
  ctx.fillStyle='rgba(255,150,140,.22)';for(const [a,b,c] of [[.2,.2,.3],[.7,.12,.28],[.55,.3,.22],[.1,.36,.2]]){ctx.beginPath();ctx.ellipse(W*a,H*b,W*c*.5,14,0,0,7);ctx.fill()}

  const L=[],S1=s0*1.3;
  for(const e of TE){const u=(tt*.09+e.ph)%1,s=S1*(.17+.83*u),x=cx+e.lat*(W*.6*(1-u)+150*s0*u),y0=hz+6+(gy-hz-6)*Math.pow(u,1.15)*.88,
    y=y0-Math.abs(Math.sin(tt*5.5+e.ph*20))*60*s,al=Math.min(1,u*10,(1-u)*6);
    L.push({y:y0,f:()=>e.k=='octo'?octo(x,y,s*1.15,tt,e.ph,al):fig(e.k,x,y,s,tt,e.ph,false,al)})}
  [['ss',-1,0],['ks',1,.5]].forEach(([k,sd,ph])=>{const u=(tt*.11+ph)%1,x=cx+sd*(W*.56-W*.26*u),y=H*.99-Math.abs(Math.sin(tt*6+ph*9))*40,al=Math.min(1,u*8,(1-u)*5);
    L.push({y:H,f:()=>fig(k,x,y,S1*1.05,tt,ph,true,al)})});

  L.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
}
function draw(){
  if(st=='title'){if(SP.meT)drawTitle();return}
  if(st=='shop'){ctx.fillStyle='#16201a';ctx.fillRect(0,0,W,H);return}
  drawField();
  if(!P)return;

    ctx.fillStyle='rgba(255,230,120,'+(.25+.15*Math.sin(t*6))+')';ctx.beginPath();ctx.arc(i.x,i.y,24,0,7);ctx.fill();

    ctx.font='14px DotGothic16,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText('동기',P.x,P.y+SH*.5+4);ctx.fillStyle='#fff';ctx.fillText('동기',P.x,P.y+SH*.5+4);ctx.textAlign='left'}}];

    if(e.hp<e.mx){const w=36,y=e.y-SH*e.sc/2-8;ctx.fillStyle='#000';ctx.fillRect(e.x-w/2,y,w,4);ctx.fillStyle='#e44';ctx.fillRect(e.x-w/2,y,w*e.hp/e.mx,4)}}});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());

    if(f.line){ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke()}
    else{ctx.beginPath();ctx.arc(f.x,f.y,f.r*(f.ring?1:1.1-k*.3),0,7);f.ring?ctx.stroke():ctx.fill()}
    ctx.globalAlpha=1}
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(6,6,390,76);ctx.fillStyle='#000';ctx.fillRect(12,12,164,16);ctx.fillStyle=hp>35?'#4ad06a':'#e44';ctx.fillRect(14,14,160*hp/P.max,12);
  ctx.fillStyle='#f4efe0';ctx.font='18px DotGothic16,sans-serif';ctx.textBaseline='top';
  ctx.fillText('HP '+Math.ceil(hp)+'/'+P.max+'   점수 '+SCORE()+'   '+Math.floor(t)+'초',12,34);
  const q=WP[P.w];ctx.fillText('무기: '+q.n+' (사거리 '+q.r+' · 공격력 '+Math.round(q.d*(1+ST.dm))+(q.sr?' · 스플래시 '+Math.round(q.sp*100)+'%':q.m=='aoe'?' · 범위 전체':'')+')',12,54);
}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st=='play')update(dt);draw();requestAnimationFrame(loop)}
const ld=s=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(i);i.src=s});
