<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동기의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{color-scheme:dark;--bg:#16201a;--ink:#f4efe0;--gold:#ffcf3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Malgun Gothic",system-ui,sans-serif;overflow:hidden;touch-action:none}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
canvas#c{display:block;width:100%;height:100%}
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,16,12,.9);padding:16px;text-align:center;overflow:auto;touch-action:pan-x pan-y}
#ov.t{background:none;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));overflow:hidden}
.ver{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:14px;font-size:14px;opacity:.8;letter-spacing:1px;text-shadow:0 1px 2px #000}
#ov.t h1{text-shadow:0 3px 0 #5a1d3a,0 0 22px rgba(255,170,80,.6);line-height:1.15}
h1{margin:0;font-size:clamp(30px,7vw,52px);font-weight:400;color:var(--gold)}
p{margin:0;font-size:15px;max-width:34em;line-height:1.55}
.bt{display:flex;flex-direction:column;gap:10px;align-items:center}
.b{font:inherit;font-size:20px;padding:10px 30px;background:var(--gold);color:#2a2000;border:0;cursor:pointer;box-shadow:0 4px 0 #a07d10;min-width:190px}
#ov.lv{background:rgba(8,12,10,.18);gap:6px}#ov.lv h1{font-size:24px;text-shadow:0 2px 6px #000,0 0 3px #000}#ov.lv .gd{font-size:13px;text-shadow:0 1px 4px #000}.upw{display:flex;gap:8px;width:min(520px,96%);justify-content:center}.b.up{flex:1;min-width:0;max-width:164px;font-size:14px;padding:8px 6px;line-height:1.3;background:rgba(233,210,122,.94);box-shadow:0 3px 10px rgba(0,0,0,.45)}.b.up small{display:block;font-size:11px;opacity:.85;margin-top:4px}.b.up i{display:block;font-style:normal;font-size:11px;color:#7a5a00;margin-top:3px}
#ov.ch{justify-content:safe center;gap:4px;padding:6px 12px}#ov.ch h1{font-size:24px}#ov.ch .b{padding:6px 20px;font-size:16px}.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:5px;width:min(780px,98%)}.chc{font:inherit;background:#26382b;color:#fff;border:2px solid #3f5a43;padding:5px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.chc.on{border-color:var(--gold);background:#3a4a24}.chc b{font-weight:400;font-size:16px}.chh{display:flex;align-items:center;justify-content:space-between;width:min(780px,98%);gap:8px}.chh h1{flex:1}#ov.ch .chh .b{min-width:0;width:130px;padding:8px 6px;white-space:nowrap}.chc small{font-size:11px;opacity:.9;line-height:1.3}.chc small .sp{color:#ffe27a}.chc.lk{opacity:.55;min-height:56px;justify-content:center}.chc.lk .chi{filter:grayscale(1) brightness(.6)}.chc em{font-style:normal;color:var(--gold);font-size:13px}.chi{width:34px;height:38px;object-fit:contain}.chi.me{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#3a74c9;font-size:20px;width:34px;height:34px}
.b.s{background:#3b4f6b;color:#fff;box-shadow:0 4px 0 #1e2b3d}
.bt.r{align-items:stretch!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:10px}.b.ic{min-width:0!important;width:auto;padding:8px 16px!important;display:flex;align-items:center}
.bt.g2{display:grid!important;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,86vw)}.bt.g2 .b{min-width:0;width:100%;padding-left:8px;padding-right:8px}.bt.g2>.gd,.bt.g2>.in,.bt.g2>p{grid-column:1/-1;justify-self:center;margin:0}.bt.g2>.in{width:min(240px,70%);box-sizing:border-box}
.b:focus-visible,.it:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gd{color:var(--gold);font-size:18px}
.sl{font-size:16px;margin:6px 0 4px;opacity:.9}
.gi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.it{font:inherit;width:118px;padding:8px 4px;background:#243326;color:inherit;border:3px solid #3f5a43;cursor:pointer;font-size:13px;line-height:1.4}
.it.eq{border-color:var(--gold);background:#35482f}
.it.no{opacity:.55}
.it b{display:block;font-weight:400;font-size:15px}
.rs{font-size:17px;line-height:1.8}
#lst{position:fixed;left:8px;top:120px;display:none;flex-direction:column;gap:2px;pointer-events:none;background:rgba(0,0,0,.5);padding:6px 8px;min-width:104px;border-radius:6px}
#lst:empty{display:none!important}
#lst div{display:flex;align-items:center;gap:6px;font-size:16px}
#lst canvas{width:34px;height:34px}
#lst b{font-weight:400;margin-left:auto;color:var(--gold)}
@media(max-width:520px){#lst div{font-size:13px;gap:4px}#lst canvas{width:24px;height:24px}#lst{min-width:84px;padding:4px 6px}h1{font-size:34px}.b{font-size:18px;padding:9px 24px}}
@media(max-height:500px){h1{font-size:30px}h1 br{display:none}.b{font-size:17px;padding:8px 22px;min-width:150px}.bt{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}.bt>.gd,.bt>p{width:100%}#lst div{font-size:12px;gap:4px}#lst canvas{width:22px;height:22px}#lst{min-width:80px;padding:3px 6px}#ov{gap:8px}.it{width:100px;font-size:12px}}
.in{font:inherit;font-size:16px;padding:7px 10px;width:170px;text-align:center;background:#243326;color:#fff;border:2px solid #3f5a43}
.rk{width:min(480px,92vw);font-size:15px;text-align:left;display:flex;flex-direction:column;gap:2px}
.rk div{display:flex;gap:10px;padding:4px 8px;background:rgba(255,255,255,.06)}
.rk div.me{background:rgba(255,207,63,.25)}
.rk div{align-items:center}.rk div span:nth-child(1){width:28px;color:var(--gold)}.rk .rci{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.rk .rci img{width:24px;height:26px;object-fit:contain}.rk .rci b{font-weight:400;font-size:12px;width:22px;height:22px;border-radius:50%;background:#3a74c9;display:flex;align-items:center;justify-content:center}.rk div span:nth-child(3){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk div span:nth-child(5){opacity:.7}
</style>
</head>
