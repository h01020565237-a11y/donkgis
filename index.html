<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동기의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{color-scheme:dark;--bg:#16201a;--ink:#f4efe0;--gold:#ffcf3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Malgun Gothic",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas#c{display:block;width:100%;height:100%}
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,16,12,.9);padding:16px;text-align:center;overflow:auto;touch-action:pan-y}
#ov.t{background:none;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));overflow:hidden}
#ov.t h1{text-shadow:0 3px 0 #5a1d3a,0 0 22px rgba(255,170,80,.6);line-height:1.15}
h1{margin:0;font-size:clamp(30px,7vw,52px);font-weight:400;color:var(--gold)}
p{margin:0;font-size:15px;max-width:34em;line-height:1.55}
.bt{display:flex;flex-direction:column;gap:10px;align-items:center}
.b{font:inherit;font-size:20px;padding:10px 30px;background:var(--gold);color:#2a2000;border:0;cursor:pointer;box-shadow:0 4px 0 #a07d10;min-width:190px}
.b.s{background:#3b4f6b;color:#fff;box-shadow:0 4px 0 #1e2b3d}
.bt.r{align-items:stretch!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:10px}.b.ic{min-width:0!important;width:auto;padding:8px 16px!important;display:flex;align-items:center}
.bt.g2{display:grid!important;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,86vw)}.bt.g2 .b{min-width:0;width:100%;padding-left:8px;padding-right:8px}
.b:focus-visible,.it:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gd{color:var(--gold);font-size:18px}
.sl{font-size:16px;margin:6px 0 4px;opacity:.9}
.gi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.it{font:inherit;width:118px;padding:8px 4px;background:#243326;color:inherit;border:3px solid #3f5a43;cursor:pointer;font-size:13px;line-height:1.4}
.it.eq{border-color:var(--gold);background:#35482f}
.it.no{opacity:.55}
.it b{display:block;font-weight:400;font-size:15px}
.rs{font-size:17px;line-height:1.8}
#lst{position:fixed;left:8px;top:120px;display:none;flex-direction:column;gap:2px;pointer-events:none;background:rgba(0,0,0,.5);padding:6px 8px;min-width:104px;border-radius:6px}
#lst:empty{display:none!important}
#lst div{display:flex;align-items:center;gap:6px;font-size:16px}
#lst canvas{width:34px;height:34px}
#lst b{font-weight:400;margin-left:auto;color:var(--gold)}
@media(max-width:520px){#lst div{font-size:13px;gap:4px}#lst canvas{width:24px;height:24px}#lst{min-width:84px;padding:4px 6px}h1{font-size:34px}.b{font-size:18px;padding:9px 24px}}
@media(max-height:500px){h1{font-size:30px}h1 br{display:none}.b{font-size:17px;padding:8px 22px;min-width:150px}.bt{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}.bt>.gd,.bt>p{width:100%}#lst div{font-size:12px;gap:4px}#lst canvas{width:22px;height:22px}#lst{min-width:80px;padding:3px 6px}#ov{gap:8px}.it{width:100px;font-size:12px}}
.in{font:inherit;font-size:16px;padding:7px 10px;width:170px;text-align:center;background:#243326;color:#fff;border:2px solid #3f5a43}
.rk{width:min(480px,92vw);font-size:15px;text-align:left;display:flex;flex-direction:column;gap:2px}
.rk div{display:flex;gap:10px;padding:4px 8px;background:rgba(255,255,255,.06)}
.rk div.me{background:rgba(255,207,63,.25)}
.rk div span:nth-child(1){width:28px;color:var(--gold)}.rk div span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk div span:nth-child(4){opacity:.7}
</style>
</head>

<div id="lst"></div>

    L.forEach((en,j)=>{const q=popPos(k,j),sel=en.i==cur;ctx.save();circ(q.x,q.y,q.r,'rgba(15,25,20,.88)');ctx.strokeStyle=sel?'#ffcf3f':'rgba(255,255,255,.5)';ctx.lineWidth=sel?4:2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.stroke();
      ctx.font='11px DotGothic16,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      if(!en.it){ctx.fillStyle='#fff';ctx.fillText('주먹',q.x,q.y)}
      else{drawWIcon(en.it.w,q.x,q.y-4,IS[en.it.w]*.65);const lv=P.lv[en.it.w];if(lv){ctx.fillStyle=GC[lv];ctx.fillText(GN[lv],q.x+q.r*.42,q.y-q.r*.66)}
        if(k=='melee'){const f=en.it.dur/WP[en.it.w].dur,bw=q.r*1.3;ctx.fillStyle='#000';ctx.fillRect(q.x-bw/2,q.y+q.r*.5,bw,5);ctx.fillStyle=f>.3?'#7dffa0':'#ff6a5a';ctx.fillRect(q.x-bw/2,q.y+q.r*.5,bw*f,5)}
        else{ctx.fillStyle='#fff';ctx.fillText(en.it.mag+'/'+en.it.res,q.x,q.y+q.r*.6)}}
      ctx.restore()})}
}
function drawMenuBtn(){const b=menuBtn();ctx.save();rr(b.x,b.y,b.s,b.s,9,'rgba(0,0,0,.55)');ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(b.x,b.y,b.s,b.s,9);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(b.x+11,b.y+9,5,18);ctx.fillRect(b.x+20,b.y+9,5,18);ctx.restore()}
function drawBanner(){if(WV.ban<=0)return;const a=Math.min(1,WV.ban/.7,(2.8-WV.ban)/.3+.4);ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(Math.min(W*.09,H*.16))+'px DotGothic16,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='#2a1a00';ctx.strokeText('WAVE '+WV.n,W/2,H*.42);ctx.fillStyle='#ffd84a';ctx.fillText('WAVE '+WV.n,W/2,H*.42);ctx.restore()}
function drawUI(){
  const sm=H<500||W<520;
  ctx.save();ctx.textBaseline='top';ctx.textAlign='left';
  const cw=sm?Math.min(W*.46,330):520;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(6,6,cw,CHIP);ctx.fillStyle='#000';ctx.fillRect(12,12,sm?110:164,12);ctx.fillStyle=hp>35?'#4ad06a':'#e44';ctx.fillRect(13,13,(sm?108:162)*hp/P.max,10);
  ctx.fillStyle='#f4efe0';ctx.font=FS+'px DotGothic16,sans-serif';
  ctx.fillText('HP '+Math.ceil(hp)+'/'+P.max+'  웨이브 '+WV.n+'  점수 '+SCORE()+'  '+Math.floor(t)+'초',12,28);
  const lv=P.lv[P.w]||0,q=WP[P.w],dm=Math.round(q.d*(1+ST.dm)*GM[lv]),nm=q.n+(lv?' ['+GN[lv]+']':'');
  ctx.fillText(sm?('무기 '+nm+' · 공격 '+dm+' · 사거리 '+q.r):('무기: '+nm+' (사거리 '+q.r+' · 공격력 '+dm+(q.sr?' · 스플래시 '+Math.round(q.sp*100)+'%':q.m=='aoe'?' · 범위 전체':'')+')'),12,28+LH);
  const nx=P.hides>=30?30:(Math.floor(P.hides/10)+1)*10;
  ctx.fillText('방어력 '+DEF()+' · 곰 가죽 '+P.hides+'/'+nx+(P.glove?' · 장갑':''),12,28+2*LH);
  if(MSG.t>0){ctx.save();ctx.globalAlpha=Math.min(1,MSG.t);ctx.font=(sm?16:22)+'px DotGothic16,sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(MSG.s,W/2,H*.3);ctx.fillStyle='#ffe27a';ctx.fillText(MSG.s,W/2,H*.3);ctx.restore()}
  for(const e of E)if(e.k=='hg'){const sx=e.x-camX,sy=e.y-camY;
    if(sx<10||sx>W-10||sy<CHIP+10||sy>H-10){const px=Math.max(22,Math.min(W-22,sx)),py=Math.max(CHIP+30,Math.min(H-22,sy)),an=Math.atan2(sy-H/2,sx-W/2);
      ctx.save();ctx.translate(px,py);ctx.rotate(an);ctx.fillStyle='#ffd84a';ctx.strokeStyle='#4a3000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
  const mw=Math.min(96,W*.14),mh=mw*WH/WW,mx=W-mw-8,my=52,kx=mw/WW,ky=mh/WH;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.strokeRect(mx+camX*kx,my+camY*ky,W*kx,H*ky);
  for(const e of E){ctx.fillStyle=e.boss?'#ff2020':e.k=='hg'?'#ffd84a':'#ff8a7a';const rr_=e.boss?5:e.k=='hg'?4:2;ctx.fillRect(mx+e.x*kx-rr_/2,my+e.y*ky-rr_/2,rr_,rr_)}
  ctx.fillStyle='#4ac8ff';ctx.fillRect(mx+P.x*kx-2,my+P.y*ky-2,4,4);
  const bs=E.find(e=>e.boss);
  if(bs){const bw=Math.min(300,W*.32),bx=W/2-bw/2,by=H-24;ctx.fillStyle='#000';ctx.fillRect(bx-2,by-2,bw+4,12);ctx.fillStyle='#e02020';ctx.fillRect(bx,by,bw*Math.max(0,bs.hp)/bs.mx,8);
    ctx.fillStyle='#fff';ctx.font='13px DotGothic16,sans-serif';ctx.textAlign='center';(ctx.fillStyle=bs.ber?'#ff5a4a':'#fff',ctx.fillText('보스 '+EN[bs.k].n+(bs.ber?' · 광폭화!':' · 광폭화까지 '+Math.max(0,Math.ceil(BERT-bs.bt))+'초'),W/2,by-18))}
  if(BOSS.warn>0&&BOSS.pend){const on=Math.floor(BOSS.warn*5)%2==0;
    if(on){ctx.fillStyle='rgba(255,0,0,.14)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='bold '+Math.round(Math.min(W*.11,H*.2))+'px Impact,"Arial Black",sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#3a0000';ctx.strokeText('WARNING',W/2,H/2);ctx.fillStyle='#ff1a1a';ctx.fillText('WARNING',W/2,H/2);
      ctx.font=(sm?15:20)+'px DotGothic16,sans-serif';ctx.lineWidth=4;ctx.strokeText('강력한 보스가 다가온다!',W/2,H/2+Math.min(W*.07,H*.13));ctx.fillStyle='#fff';ctx.fillText('강력한 보스가 다가온다!',W/2,H/2+Math.min(W*.07,H*.13))}}
  ctx.restore();
  if(st=='play'){drawControls();drawMenuBtn();drawBanner()}
}
function draw(){
  if(st=='title'){if(HIMG.jy)drawTitle();return}
  if(st=='shop'||st=='rank'){ctx.fillStyle='#16201a';ctx.fillRect(0,0,W,H);return}
  drawField();
  if(!P)return;
  ctx.save();ctx.translate(-camX,-camY);
  for(const i of IT)drawItem(i);
  for(const e of E)if(e.boss&&e.zones)drawZones(e);
  const FEET=P.y+32,items=[{y:P.y,f:()=>{
    if(P.inv>0&&Math.floor(P.inv*20)%2)ctx.globalAlpha=.5;
    pl(P.x,FEET,PS,P.f,t,P.mv);ctx.globalAlpha=1;drawHand(FEET);
    ctx.font='13px DotGothic16,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText('동기',P.x,P.y+44);ctx.fillStyle='#fff';ctx.fillText('동기',P.x,P.y+44);ctx.textAlign='left'}}];
  for(const e of E)items.push({y:e.y,f:()=>{
    let al=e.fl>0?.55:Math.min(1,e.age/.4);if(e.k=='hg')al*=Math.min(1,e.life*1.5);
    const gs=e.k=='jy'?.52:.48;
    if(e.boss){drawTele(e);const hh_=e.hop>0?Math.sin(Math.min(1,e.hop/.18)*Math.PI)*18:0,sh=e.ber?(Math.random()-.5)*3:0;const cr=e.k=='ks'&&e.st=='crouch';if(cr){ctx.save();ctx.translate(e.x,e.y+60);ctx.scale(1.1,.78);ctx.translate(-e.x,-(e.y+60))}
      bossDraw(Object.assign({},e,{x:e.x+sh+(cr?Math.sin(t*60)*1.5:0),y:e.y-hh_}),al,gs*1.9);if(cr)ctx.restore();return}
    if(e.k=='octo')octo(e.x,e.y+28,.5,t,e.ph,al);
    else fig(e.k,e.x,e.y+70*gs,gs,e.k=='hg'?e.at:t,e.ph,e.k=='ss'||e.k=='ks',al);
    const by=e.y-78*gs-8;
    if(e.hp<e.mx||e.k=='hg'){const w=30;ctx.globalAlpha=al;ctx.fillStyle='#000';ctx.fillRect(e.x-w/2,by,w,3);ctx.fillStyle=e.k=='hg'?'#ffd84a':'#e44';ctx.fillRect(e.x-w/2,by,w*e.hp/e.mx,3);ctx.globalAlpha=1}
    if(e.k=='hg'){ctx.font='14px DotGothic16,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#4a3000';const hl='현곤 '+Math.max(0,Math.ceil(e.life))+'s';ctx.strokeText(hl,e.x,by-16);ctx.fillStyle='#ffe27a';ctx.fillText(hl,e.x,by-16);ctx.textAlign='left'}}});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  for(const b of B){if(b.heart){drawHeart(b.x,b.y,12+Math.sin(t*12)*1.3);continue}if(b.ball){drawBall(b);continue}ctx.fillStyle=b.own?'#fff3a0':'#ff5a4a';ctx.beginPath();ctx.arc(b.x,b.y,b.own?3.5:4.5,0,7);ctx.fill()}
  for(const f of F){const k=f.t/f.m;ctx.globalAlpha=k*.7;ctx.strokeStyle=f.c;ctx.fillStyle=f.c;ctx.lineWidth=4;
    if(f.line){ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke()}
    else{ctx.beginPath();ctx.arc(f.x,f.y,f.r*(f.ring?1:1.1-k*.3),0,7);f.ring?ctx.stroke():ctx.fill()}
    ctx.globalAlpha=1}
  ctx.restore();
  drawUI();
}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st=='play')update(dt);draw();requestAnimationFrame(loop)}
const ld=s=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(i);i.src=s});
Promise.all([...Object.entries(HI).map(([k,v])=>ld(v).then(i=>['h'+k,i])),ld(BGD).then(i=>['bg',i])]).then(a=>init(Object.fromEntries(a)));
requestAnimationFrame(loop);
</script>
